[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patrickstar-agents"
version = "0.1.1"
description = "Delegate work from Codex to Claude Code and Gemini over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["zeromcp==1.10.3", "httpx==0.28.1"]

[project.scripts]
patrickstar-agents = "patrickstar_agents.server:main"

[tool.setuptools]
packages = ["patrickstar_agents"]
